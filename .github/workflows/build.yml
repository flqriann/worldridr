# Baut worldridr mit CMake (MSVC + Ninja) und veroeffentlicht bei jedem Push auf main ein Release am gebauten Commit.
# Tag-Pushes (v*) bauen ebenfalls und benutzen den Tag als Release-Namen.
name: Build und Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # Release anlegen

jobs:
  linux:
    # Linux-Fassung: ohne VR (OpenXR/Meta Horizon Link gibt es hier nicht), Rest wie unter Windows.
    # continue-on-error: schlaegt dieser Job fehl, laeuft das Windows-Release trotzdem durch.
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Systempakete (SDL3-Abhaengigkeiten, OpenGL, libcurl)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libcurl4-openssl-dev libgl1-mesa-dev libglu1-mesa-dev             libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev libwayland-dev             libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Abhaengigkeiten zwischenspeichern
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-${{ hashFiles('CMakeLists.txt') }}

      - name: Konfigurieren
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Bauen
        run: cmake --build build --parallel

      - name: Paket schnueren
        run: |
          short="${GITHUB_SHA::7}"
          dir="worldridr-$short-linux"
          mkdir "$dir" "$dir/maps"
          cp build/worldridr "$dir/"
          cp -r assets scripts "$dir/"
          for f in config.lua shifter.cfg README.md; do [ -f "$f" ] && cp "$f" "$dir/"; done
          printf '#!/bin/sh
cd "$(dirname "$0")"
exec ./worldridr "$@"
' > "$dir/run.sh"
          chmod +x "$dir/run.sh" "$dir/worldridr"
          tar czf "$dir.tar.gz" "$dir"
          echo "TGZ=$dir.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: worldridr-linux
          path: ${{ env.TGZ }}

  windows:
    runs-on: windows-latest
    needs: [linux]
    if: ${{ !cancelled() }}   # auch wenn der Linux-Job fehlschlaegt
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Abhaengigkeiten zwischenspeichern (SDL3, OpenXR, Lua ...)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Konfigurieren
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Bauen
        run: cmake --build build --parallel

      - name: Paket schnueren
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 7)
          $dir = "worldridr-$short"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item build/worldridr.exe $dir/
          Copy-Item -Recurse assets, scripts $dir/
          foreach ($f in 'config.lua', 'shifter.cfg', 'README.md', 'run.bat') { if (Test-Path $f) { Copy-Item $f $dir/ } }
          New-Item -ItemType Directory "$dir/maps" | Out-Null
          Compress-Archive -Path $dir -DestinationPath "$dir-windows.zip"
          "ZIP=$dir-windows.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "SHORT=$short" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: worldridr-windows
          path: ${{ env.ZIP }}

      - name: Linux-Paket holen (falls gebaut)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: worldridr-linux
          path: linux

      - name: Release am Commit anlegen
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') { $tag = $env:GITHUB_REF_NAME; $title = "worldridr $tag"; $pre = @() }
          else { $tag = "build-$($env:GITHUB_RUN_NUMBER)-$env:SHORT"; $title = "Build $($env:GITHUB_RUN_NUMBER) ($env:SHORT)"; $pre = @('--prerelease') }
          # --target: der Tag zeigt auf genau den gebauten Commit, das Release erscheint dort in der Commit-Ansicht
          $files = @($env:ZIP) + @(Get-ChildItem linux -Filter *.tar.gz -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          gh release create $tag @files --target $env:GITHUB_SHA --title $title --generate-notes @pre
