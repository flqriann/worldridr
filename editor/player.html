<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forge Player</title>
    <style>
      html, body { margin: 0; background: #14161b; }
      .boot-splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: radial-gradient(ellipse at 50% 35%, #1f3157 0%, #14161b 60%); transition: opacity .35s ease; }
      .boot-splash.hide { opacity: 0; pointer-events: none; }
      .boot-logo { width: 64px; height: 64px; background: linear-gradient(135deg, #4f95ff, #2f7cf6 55%, #7b5cff); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
        animation: boot-pulse 1.6s ease-in-out infinite; }
      .boot-title { font: 600 22px 'Segoe UI', system-ui, sans-serif; color: #e8ecf3; letter-spacing: .3px; }
      .boot-title span { color: #8fb6ff; font-weight: 400; }
      .boot-bar { width: 180px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
      .boot-bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, transparent, #4f95ff, transparent); animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-pulse { 50% { transform: scale(.93); filter: brightness(1.25); } }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div id="boot-splash" class="boot-splash"><div class="boot-logo"></div><div class="boot-title">Forge <span>Player</span></div><div class="boot-bar"><i></i></div></div>
    <div id="root"></div>
    <script type="module" src="/src/player/main.tsx"></script>
  </body>
</html>
