[package]
name = "forge-core"
version = "0.2.0"
edition = "2021"
description = "Forge Studio native core: terrain storage, sculpting, generation, chunked meshing and ray queries (compiled to WebAssembly)."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
