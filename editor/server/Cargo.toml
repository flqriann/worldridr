[package]
name = "forge-server"
version = "0.2.0"
edition = "2021"
description = "Forge game server: git-like publishing of game versions, game catalog, multiplayer sessions over WebSocket and per-game DataStores."
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
tower-http = { version = "0.5", features = ["cors", "limit"] }
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
